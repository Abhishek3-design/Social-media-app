
[project]
name = "social-media-app"
version = "0.1.0"
description = "Social Media App backend"
requires-python = ">=3.12"
dependencies = [
    "asyncpg",
    "fastapi>=0.142.2",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=5.10.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
